<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pocket Raja</title>
<style>
  :root { --night:#121933; --cloth:#efe1bc; --ink:#1e1713; --verm:#c7311f; --gold:#c8993a; --turm:#e8b21e; }
  html, body { margin:0; height:100%; background:var(--night); overflow:hidden; touch-action:none; }
  body { display:flex; align-items:center; justify-content:center;
         background-image:radial-gradient(circle at 1px 1px, rgba(239,229,204,.07) 1.3px, transparent 1.5px); background-size:24px 24px; }
  #stage { position:relative; height:100%; max-width:100%; aspect-ratio:540 / 960; }
  #unity-canvas { width:100%; height:100%; display:block; background:var(--cloth); border:3px solid var(--ink); box-sizing:border-box; }
  #loading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
             background:var(--cloth); border:3px solid var(--ink); box-sizing:border-box; font-family:Georgia,'Times New Roman',serif; color:var(--ink); }
  #loading h1 { margin:0; font-size:clamp(28px,7vh,54px); font-weight:400; letter-spacing:.02em; }
  #loading p  { margin:0; font-size:clamp(13px,2.2vh,18px); color:#7a1f2b; }
  #bar { width:62%; height:18px; border:3px solid var(--ink); background:#e2cf9d; box-sizing:border-box; }
  #fill { height:100%; width:0%; background:var(--verm); }
  #full { position:absolute; right:8px; bottom:8px; width:34px; height:34px; border:2px solid var(--ink); background:var(--cloth); color:var(--ink);
          font:700 18px/1 Georgia,serif; cursor:pointer; opacity:.85; display:none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><h1>Pocket Raja</h1><p>Sink the king</p><div id="bar"><div id="fill"></div></div></div>
  <button id="full" title="Fullscreen" aria-label="Fullscreen">&#x26F6;</button>
</div>
<script src="Build/play.loader.js"></script>
<script>
  var canvas = document.getElementById('unity-canvas');
  var fill = document.getElementById('fill');
  var loading = document.getElementById('loading');
  var full = document.getElementById('full');
  createUnityInstance(canvas, {
    dataUrl: 'Build/play.data.unityweb',
    frameworkUrl: 'Build/play.framework.js.unityweb',
    codeUrl: 'Build/play.wasm.unityweb',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'Sanidhya Dev Gupta',
    productName: 'Pocket Raja',
    productVersion: '1.0'
  }, function (p) { fill.style.width = Math.round(p * 100) + '%'; }).then(function (u) {
    loading.style.display = 'none';
    full.style.display = 'block';
    full.onclick = function () { u.SetFullscreen(1); };
  }).catch(function (m) { loading.querySelector('p').textContent = 'Could not start: ' + m; });
</script>
</body>
</html>
